name: Feature request
description: Suggest something this plugin doesn't do yet
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening a request, it's worth a quick check that it's not already planned — feel free to ask in the issue itself if you're not sure.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the workflow or problem, not just the feature — it helps to know the "why".
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you want this to look like? Rough is fine.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you're using today, or other approaches you thought about.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and didn't find this already requested
          required: true
